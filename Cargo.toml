[workspace]
resolver = "2"
members = [
    "frontend/src-tauri",
    "llama-helper"
]

# Shared workspace settings
[workspace.package]
edition = "2021"
rust-version = "1.77"

# Optimize image-heavy crates even in dev builds.
# Without this, 4K screen capture + resize + JPEG encode takes ~4s in debug
# vs ~300ms with optimizations. Our own code stays debuggable.
[profile.dev.package.image]
opt-level = 2
[profile.dev.package.xcap]
opt-level = 2
[profile.dev.package.zune-jpeg]
opt-level = 2

# Shared dependencies that can be inherited by workspace members
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full"] }
