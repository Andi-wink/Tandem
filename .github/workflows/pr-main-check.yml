name: "PR Check"

# Runs type checks and tests on every PR targeting main
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Version & config validation ───────────────────────────────────────────
  validation-check:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tauri.conf.json
        id: get-version
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Validate version format
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version format is valid: $VERSION"
          else
            echo "::error::Version '$VERSION' is not in semver format (X.Y.Z)"
            exit 1
          fi

  # ── Frontend: TypeScript type check + tests ───────────────────────────────
  frontend-checks:
    name: Frontend (tsc + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        working-directory: frontend
        run: pnpm tsc --noEmit

      - name: Run frontend tests
        working-directory: frontend
        run: pnpm test -- --run --reporter=verbose

  # ── Backend: Python tests ─────────────────────────────────────────────────
  backend-checks:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -v

  # ── Rust: cargo check + database tests ────────────────────────────────────
  rust-checks:
    name: Rust (check + DB tests)
    runs-on: ubuntu-latest
    env:
      WHISPER_NO_AVX: "ON"
      WHISPER_NO_AVX2: "ON"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libx11-dev \
            libxtst-dev \
            libxrandr-dev \
            cmake \
            llvm-dev \
            libclang-dev \
            clang

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Cargo check (type validation)
        working-directory: frontend/src-tauri
        run: cargo check

      - name: Run Rust database tests
        working-directory: frontend/src-tauri
        run: cargo test --lib database::repositories -- --nocapture
